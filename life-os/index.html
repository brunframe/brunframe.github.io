<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEEEF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LIFE OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
/* LIFE OS — noir et blanc, en verre. Fond gris clair légèrement nuancé, surfaces translucides,
   le noir réservé à l'action principale et à ce qui est choisi. Chaque touche réagit : elle s'enfonce,
   une onde part du doigt, l'iPhone vibre légèrement (iOS 18 et plus). Mouvements coupés si l'iPhone le demande. */
:root {
  --noir: #0A0A0A;
  --blanc: #FFFFFF;
  --gris: #5E5E64;
  --gris-2: #98989E;
  --filet: rgba(10, 10, 10, 0.09);
  --base: #EEEEF1;
  --verre: linear-gradient(180deg, rgba(255, 255, 255, 0.80), rgba(255, 255, 255, 0.52));
  --verre-plat: rgba(255, 255, 255, 0.58);
  --verre-fort: rgba(255, 255, 255, 0.9);
  --bord: rgba(255, 255, 255, 0.9);
  --ombre: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 0 0 0.5px rgba(10, 10, 10, 0.08), 0 8px 22px -12px rgba(10, 10, 10, 0.30);
  --ombre-l: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 0 0 0.5px rgba(10, 10, 10, 0.07), 0 2px 8px -4px rgba(10, 10, 10, 0.18);
  --noir-verre: linear-gradient(180deg, rgba(52, 52, 56, 0.95), rgba(10, 10, 10, 0.92));
  --ombre-noire: inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 0 0 0.5px rgba(255, 255, 255, 0.10), 0 10px 24px -10px rgba(10, 10, 10, 0.60);
  --flou: blur(22px) saturate(180%);
  --ressort: cubic-bezier(0.2, 1.6, 0.4, 1);
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --gl: max(18px, env(safe-area-inset-left, 0px));
  --gr: max(18px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--base); }
body { margin: 0; background: transparent; color: var(--noir); font: 400 17px/1.45 var(--f); min-height: 100vh; -webkit-font-smoothing: antialiased; }
/* Le fond : de la lumière et deux ombres très douces, pour que le verre ait quelque chose à laisser voir. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(70vmax 48vmax at 0% 0%, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 62%),
    radial-gradient(52vmax 38vmax at 100% 22%, rgba(10, 10, 10, 0.11), rgba(10, 10, 10, 0) 66%),
    radial-gradient(58vmax 42vmax at 4% 72%, rgba(10, 10, 10, 0.08), rgba(10, 10, 10, 0) 66%),
    radial-gradient(64vmax 46vmax at 100% 100%, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0) 60%),
    linear-gradient(165deg, #F7F7F9 0%, #E8E8EC 55%, #F0F0F3 100%);
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.5; cursor: default; }
[hidden] { display: none !important; }
p { margin: 0; }
a { color: var(--noir); }
:focus-visible { outline: 2px solid var(--noir); outline-offset: 2px; }
.cache { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

/* ---------- Les touches : verre, enfoncement, onde ---------- */
.secondaire, .opt, .puce, .petit-btn, .etape, .seance-l, .rond, .etat, .rappel {
  background: var(--verre); border: 1px solid var(--bord); box-shadow: var(--ombre); color: var(--noir);
}
.principal, .secondaire, .opt, .puce, .petit-btn, .etape, .seance-l, .rond, .etat, .rappel, .nav a, .tcoche, .tsuppr, .lien-discret, .retour {
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  transition: transform 0.45s var(--ressort), background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.principal:active, .secondaire:active, .etape:active, .seance-l:active, .rappel:active { transform: scale(0.97); transition-duration: 0.08s; }
.opt:active, .puce:active, .petit-btn:active, .rond:active, .etat:active, .nav a:active, .tcoche:active, .tsuppr:active, .lien-discret:active, .retour:active { transform: scale(0.93); transition-duration: 0.08s; }
.secondaire:active, .opt:active, .puce:active, .petit-btn:active, .etape:active, .seance-l:active, .rappel:active { background: var(--verre-fort); box-shadow: var(--ombre-l); }
.principal, .secondaire, .opt, .puce, .etape, .petit-btn, .seance-l, .rond, .nav a, .etat { position: relative; overflow: hidden; isolation: isolate; }
.onde::after {
  content: ""; position: absolute; left: var(--x, 50%); top: var(--y, 50%); z-index: -1; width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border-radius: 50%; background: currentColor; opacity: 0.2; pointer-events: none; animation: onde 0.55s ease-out forwards;
}
@keyframes onde { to { transform: scale(38); opacity: 0; } }
@media (hover: hover) {
  .secondaire:hover, .opt:hover, .puce:hover, .petit-btn:hover, .etape:hover, .seance-l:hover, .rappel:hover { background: var(--verre-fort); }
  .principal:hover { box-shadow: var(--ombre-noire), 0 0 0 3px rgba(10, 10, 10, 0.08); }
}
.principal {
  appearance: none; width: 100%; max-width: 560px; display: block; margin: 0 auto; border: 0; border-radius: 18px;
  background: var(--noir-verre); color: var(--blanc); box-shadow: var(--ombre-noire); min-height: 58px; font-size: 18px; font-weight: 700;
}
.secondaire { appearance: none; width: 100%; border-radius: 18px; min-height: 54px; font-size: 17px; font-weight: 600; }
.secondaire.petit { min-height: 44px; font-size: 15px; border-radius: 14px; }
.lien-btn { display: grid; place-items: center; text-decoration: none; }
a.principal { color: var(--blanc); }
.lien-discret { appearance: none; background: none; border: 0; color: var(--gris); font-size: 16px; font-weight: 600; padding: 12px 18px; justify-self: center; border-radius: 12px; }
.toast {
  position: fixed; left: 50%; top: calc(var(--safe-t) + 62px); z-index: 60; transform: translateX(-50%); pointer-events: none;
  background: rgba(10, 10, 10, 0.84); color: var(--blanc); -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou);
  padding: 11px 18px; border-radius: 999px; font-size: 15px; font-weight: 600; white-space: nowrap; box-shadow: var(--ombre-noire);
  animation: toast 2.1s ease both;
}
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px) scale(0.96); } 12%, 84% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -6px) scale(0.98); } }

/* ---------- Cadre ---------- */
.top {
  position: sticky; top: 0; z-index: 20; padding: calc(var(--safe-t) + 10px) var(--gr) 10px var(--gl);
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(238, 238, 241, 0.55); -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou);
  border-bottom: 0.5px solid rgba(10, 10, 10, 0.06);
}
.marque { font-weight: 800; font-size: 15px; letter-spacing: 0.06em; }
.etat { appearance: none; display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--gris); }
.etat i { width: 7px; height: 7px; border-radius: 50%; background: var(--gris-2); flex: none; }
.etat svg { width: 15px; height: 15px; flex: none; color: var(--noir); }
.etat[data-s="ok"] i { background: var(--noir); }
.etat[data-s="bad"], .etat[data-s="off"] { color: var(--noir); }
.etat[data-s="bad"] i { background: var(--noir); box-shadow: 0 0 0 3px rgba(10, 10, 10, 0.15); }

main { max-width: 560px; margin: 0 auto; padding: 4px var(--gr) calc(var(--safe-b) + 112px) var(--gl); }
.vue { display: grid; gap: 26px; grid-template-columns: minmax(0, 1fr); }
.question, .liste, .bloc, .carte { grid-template-columns: minmax(0, 1fr); }
.question > *, .bloc > *, .carte > * { min-width: 0; }

.nav {
  position: fixed; z-index: 20; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(var(--safe-b) + 10px);
  max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px; border-radius: 28px;
  background: rgba(255, 255, 255, 0.6); border: 1px solid rgba(255, 255, 255, 0.85); -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 0 0 0.5px rgba(10, 10, 10, 0.08), 0 16px 36px -14px rgba(10, 10, 10, 0.38);
}
.nav a { text-align: center; text-decoration: none; color: var(--gris); font-size: 13px; font-weight: 700; padding: 12px 0; border-radius: 22px; }
.nav a[aria-current="page"] { color: var(--blanc); background: var(--noir-verre); box-shadow: var(--ombre-noire); }

/* ---------- En-tête de page ---------- */
.entete { display: grid; gap: 6px; padding-top: 14px; }
.sur { font-size: 15px; color: var(--gris); }
.entete h1 { margin: 0; font-size: 40px; line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
.entete h1 span { color: var(--gris-2); font-weight: 600; font-size: 0.55em; letter-spacing: 0; }
.jours { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.petit-btn { appearance: none; border-radius: 999px; padding: 9px 15px; font-size: 14px; font-weight: 600; }
a.petit-btn { justify-self: start; text-decoration: none; color: var(--noir); }

.bloc { display: grid; gap: 14px; }
.bloc h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gris); }
.carte { display: grid; gap: 12px; padding: 18px; border-radius: 24px; background: var(--verre); border: 1px solid var(--bord); box-shadow: var(--ombre); }
.carte h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
.carte .secondaire, .carte .principal { margin-top: 2px; }
.note { background: var(--verre-plat); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 16px; padding: 14px 16px; font-size: 15px; }
.note.ko { background: var(--noir-verre); color: var(--blanc); border-color: transparent; }
.aide { color: var(--gris); font-size: 15px; }
.rappel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 14px 16px; border-radius: 18px; text-decoration: none; }
.rappel b { font-size: 16px; font-weight: 700; }
.rappel span { font-size: 14px; color: var(--gris); }

/* ---------- Bienvenue ---------- */
.accueil-b { display: grid; justify-items: center; text-align: center; gap: 8px; padding-top: 28px; }
.logo-b { width: 76px; height: 76px; border-radius: 19px; background: var(--noir); box-shadow: 0 14px 30px -12px rgba(10, 10, 10, 0.55); }
.accueil-b h1 { margin: 6px 0 0; font-size: 34px; font-weight: 800; letter-spacing: 0.02em; }
.accueil-b .aide { max-width: 30ch; text-wrap: balance; }
.etape-n { width: 28px; height: 28px; border-radius: 50%; background: var(--noir-verre); color: var(--blanc); display: grid; place-items: center; font-weight: 700; font-size: 14px; box-shadow: var(--ombre-noire); }
.champ-l.code { text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-variant-numeric: tabular-nums; }

/* ---------- Les étapes du jour ---------- */
.etapes { display: grid; gap: 10px; }
.etape { appearance: none; width: 100%; text-align: left; border-radius: 22px; padding: 18px 16px; display: grid; grid-template-columns: 42px minmax(0, 1fr) 20px; gap: 14px; align-items: center; }
.etape .pastille { width: 42px; height: 42px; border-radius: 50%; background: var(--noir-verre); color: var(--blanc); box-shadow: var(--ombre-noire); display: grid; place-items: center; font-weight: 700; font-size: 17px; }
.etape .et b { display: block; font-size: 19px; font-weight: 700; }
.etape .et small { display: block; font-size: 14.5px; color: var(--gris); margin-top: 2px; }
.etape .fleche { font-size: 20px; font-weight: 600; }
.etape.ok { background: rgba(255, 255, 255, 0.34); box-shadow: var(--ombre-l); }
.etape.ok .pastille { background: var(--verre-fort); color: var(--noir); box-shadow: var(--ombre-l); }
.etape.ok .fleche { color: var(--gris-2); }

.prios { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.prios li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: center; font-size: 17px; }
.case { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--noir); background: rgba(255, 255, 255, 0.6); display: inline-grid; place-items: center; transition: background 0.2s ease, transform 0.4s var(--ressort); }
.fait .case, [aria-pressed="true"] > .case { background: var(--noir); transform: scale(1.06); }
.fait .case::after, [aria-pressed="true"] > .case::after { content: "✓"; color: var(--blanc); font-size: 13px; font-weight: 700; }
.prios li.fait { color: var(--gris); text-decoration: line-through; }

.titre-sem { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.regles { margin: 0; padding: 0 0 0 22px; display: grid; gap: 8px; font-size: 16px; }
.regles li::marker { font-weight: 700; }
.actions { margin: 0; padding: 0 0 0 20px; display: grid; gap: 6px; font-size: 15px; color: var(--gris); }
.soir-cible { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--noir-verre); color: var(--blanc); box-shadow: var(--ombre-noire); border-radius: 18px; padding: 16px 18px; }
.soir-cible span { font-size: 14px; opacity: 0.7; }
.soir-cible b { font-size: 17px; }

/* ---------- Le parcours : une question par écran ---------- */
.flow-top { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; }
.retour { appearance: none; background: none; border: 0; padding: 8px 0; font-size: 16px; font-weight: 600; text-decoration: none; color: var(--noir); }
.compte { font-size: 15px; color: var(--gris); font-variant-numeric: tabular-nums; }
.barre { height: 5px; background: rgba(10, 10, 10, 0.08); border-radius: 3px; overflow: hidden; }
.barre span { display: block; height: 100%; background: var(--noir); border-radius: 3px; transition: width 0.35s var(--ressort); }
.question { display: grid; gap: 14px; padding-top: 18px; }
.question h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.choix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.echelle { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.opt { appearance: none; border-radius: 18px; min-height: 64px; font-size: 20px; font-weight: 700; }
.opt[aria-pressed="true"] { background: var(--noir-verre); color: var(--blanc); border-color: rgba(255, 255, 255, 0.14); box-shadow: var(--ombre-noire); }
.opt.large { min-height: 58px; font-size: 17px; font-weight: 600; text-align: left; padding: 12px 16px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: center; }
.opt.large[aria-pressed="true"] { background: var(--verre-fort); color: var(--noir); border-color: var(--bord); box-shadow: inset 0 0 0 2px var(--noir), var(--ombre-l); }
.liste { display: grid; gap: 10px; margin-top: 6px; }
.lbl { font-size: 14px; font-weight: 600; color: var(--gris); margin-top: 6px; }
.champ-l, .grand-nombre, .grand-heure, .cellule, .champ-date, .serie label {
  background: rgba(255, 255, 255, 0.62); border: 1px solid var(--bord);
  box-shadow: inset 0 1px 3px rgba(10, 10, 10, 0.06), 0 0 0 0.5px rgba(10, 10, 10, 0.08);
  transition: box-shadow 0.2s ease, background 0.2s ease;
}
.champ-l:focus, .grand-nombre:focus, .grand-heure:focus, .champ-date:focus, .cellule:focus-within, .serie label:focus-within {
  outline: none; background: var(--verre-fort); box-shadow: inset 0 0 0 2px var(--noir), 0 6px 18px -10px rgba(10, 10, 10, 0.35);
}
.champ-l { width: 100%; border-radius: 16px; min-height: 56px; padding: 14px 16px; font-size: 18px; }
textarea.champ-l { resize: none; overflow: hidden; min-height: 96px; display: block; }
#resume-txt { font-size: 14px; line-height: 1.4; overflow: auto; }
.champ-l::placeholder { color: var(--gris-2); }
.grand-heure { appearance: none; -webkit-appearance: none; width: 100%; border-radius: 22px; min-height: 92px; padding: 0 20px; font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 10px; }
.grand-heure::-webkit-date-and-time-value { text-align: center; }
.nombre { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.grand-nombre { flex: 1; width: 100%; min-width: 0; border-radius: 22px; min-height: 84px; padding: 0 20px; font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
.nombre span { font-size: 22px; font-weight: 600; color: var(--gris); }
.compteur { display: grid; grid-template-columns: 72px minmax(0, 1fr) 72px; align-items: center; gap: 10px; margin-top: 14px; }
.rond { appearance: none; width: 72px; height: 72px; border-radius: 50%; font-size: 32px; font-weight: 500; line-height: 1; }
.rond:active { background: var(--noir-verre); color: var(--blanc); box-shadow: var(--ombre-noire); }
.val { text-align: center; font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.val small { font-size: 20px; font-weight: 600; color: var(--gris); letter-spacing: 0; }
.flow-bas { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; padding: 18px var(--gr) calc(var(--safe-b) + 12px) var(--gl); background: linear-gradient(rgba(238, 238, 241, 0), rgba(238, 238, 241, 0.94) 38%); }
.fin { display: grid; gap: 18px; padding-top: 40px; text-align: center; justify-items: center; }
.coche-grande { width: 84px; height: 84px; border-radius: 50%; background: var(--noir-verre); color: var(--blanc); box-shadow: var(--ombre-noire); display: grid; place-items: center; font-size: 40px; font-weight: 700; animation: coche 0.55s var(--ressort) both; }
@keyframes coche { from { transform: scale(0.6); } }
.fin h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; }
.recap { margin: 0; width: 100%; display: grid; gap: 10px; text-align: left; }
.recap div { background: var(--verre-plat); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.recap dt { color: var(--gris); font-size: 15px; }
.recap dd { margin: 0; font-weight: 700; font-size: 19px; text-align: right; font-variant-numeric: tabular-nums; }
.recap dd small { display: block; font-weight: 400; font-size: 13px; color: var(--gris); }
.fin .principal { margin-top: 8px; }

.grille-n { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 6px; }
.cellule { display: grid; gap: 6px; border-radius: 18px; padding: 12px 14px; }
.cellule > span:first-child { font-size: 14px; font-weight: 600; color: var(--gris); }
.saisie-n { display: flex; align-items: baseline; gap: 6px; }
.saisie-n input { width: 100%; min-width: 0; border: 0; padding: 0; background: transparent; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.saisie-n input:focus { outline: none; }
.saisie-n input::placeholder { color: rgba(10, 10, 10, 0.16); }
.saisie-n em { font-style: normal; font-size: 15px; font-weight: 600; color: var(--gris); }
.vue > .principal { min-height: 64px; font-size: 19px; }

/* ---------- Tâches ---------- */
.ajout-t { display: grid; gap: 10px; }
.puces-choix { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { appearance: none; border-radius: 999px; padding: 9px 15px; font-size: 15px; font-weight: 600; }
.puce[aria-pressed="true"] { background: var(--noir-verre); color: var(--blanc); border-color: rgba(255, 255, 255, 0.14); box-shadow: var(--ombre-noire); }
.taches { margin: 0; padding: 0 6px 0 4px; list-style: none; background: var(--verre-plat); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 20px; }
.tache, .mvt { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 8px; border-bottom: 1px solid var(--filet); min-height: 56px; }
.tache:last-child, .mvt:last-child { border-bottom: 0; }
.mvt { grid-template-columns: minmax(0, 1fr) auto auto; padding-left: 12px; }
.tcoche { appearance: none; background: none; border: 0; width: 40px; height: 48px; display: grid; place-items: center; }
.tcoche .case { border-radius: 50%; }
.tcoche[aria-pressed="true"] .case { background: var(--noir); transform: scale(1.06); }
.tcoche[aria-pressed="true"] .case::after { content: "✓"; color: var(--blanc); font-size: 13px; font-weight: 700; }
.tt { font-size: 17px; padding: 10px 0; overflow-wrap: anywhere; }
.tt small { display: block; font-size: 13px; color: var(--gris); }
.tt small.retard { color: var(--noir); font-weight: 700; }
.tache.fait .tt { color: var(--gris-2); text-decoration: line-through; }
.tsuppr { appearance: none; background: none; border: 0; min-width: 40px; height: 44px; font-size: 20px; color: var(--gris-2); padding: 0 6px; border-radius: 12px; }
.pli-t summary { list-style: none; cursor: pointer; }
.pli-t summary::-webkit-details-marker { display: none; }
.pli-t[open] summary { margin-bottom: 14px; }

/* ---------- Sport ---------- */
.types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.seances { display: grid; gap: 8px; }
.seance-l { appearance: none; width: 100%; text-align: left; border-radius: 18px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.seance-l b { display: block; font-size: 17px; }
.seance-l small { display: block; font-size: 13.5px; color: var(--gris); }
.seance-l .sv { text-align: right; font-weight: 600; font-size: 15px; }
.champ-date { border-radius: 12px; padding: 8px 12px; font-size: 16px; justify-self: start; }
.exo { background: var(--verre); border: 1px solid var(--bord); box-shadow: var(--ombre); border-radius: 22px; padding: 14px; display: grid; gap: 10px; }
.exo-h { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.exo-nom { border: 0; border-bottom: 2px solid var(--filet); padding: 6px 0; font-size: 20px; font-weight: 700; width: 100%; min-width: 0; background: transparent; }
.exo-nom:focus { outline: none; border-bottom-color: var(--noir); }
.series { display: grid; gap: 8px; }
.serie { display: grid; grid-template-columns: 26px minmax(0, 1fr) 16px minmax(0, 1fr) 36px; align-items: center; gap: 6px; }
.serie .sn { width: 26px; height: 26px; border-radius: 50%; background: var(--noir-verre); color: var(--blanc); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.serie label { display: flex; align-items: baseline; gap: 4px; border-radius: 12px; padding: 8px 10px; }
.serie input { width: 100%; min-width: 0; border: 0; background: transparent; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; padding: 0; }
.serie input:focus { outline: none; }
.serie em { font-style: normal; font-size: 13px; color: var(--gris); }
.serie .x { text-align: center; color: var(--gris); }

/* ---------- Argent ---------- */
.chiffres-ar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.chiffres-ar div { background: var(--verre); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 18px; padding: 14px; display: grid; gap: 2px; }
.chiffres-ar span { font-size: 13.5px; color: var(--gris); }
.chiffres-ar b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.chiffres-ar .fort { background: var(--noir-verre); color: var(--blanc); border-color: transparent; box-shadow: var(--ombre-noire); }
.chiffres-ar .fort span { color: rgba(255, 255, 255, 0.7); }
.deux-btn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.deux-btn .principal, .deux-btn .secondaire { min-height: 54px; }
.cats { display: grid; gap: 10px; }
.cat { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 15px; }
.cat .cb { height: 10px; background: rgba(10, 10, 10, 0.07); border-radius: 5px; overflow: hidden; }
.cat .cb i { display: block; height: 100%; background: var(--noir); border-radius: 5px; }
.cat .cv { font-weight: 700; font-variant-numeric: tabular-nums; }
.jour-ar { display: grid; gap: 6px; }
.jd { font-size: 13.5px; color: var(--gris); font-weight: 600; margin-top: 6px; }
.mm { font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Suivi ---------- */
.lignes-p { display: grid; margin-top: 6px; padding: 0 16px; background: var(--verre-plat); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 20px; }
.ligne-p { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 12px 0; border-bottom: 1px solid var(--filet); }
.ligne-p:last-child { border-bottom: 0; }
.ligne-p .n { font-size: 16px; }
.ligne-p .v { font-size: 18px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.ligne-p .o { grid-column: 1 / -1; font-size: 13.5px; color: var(--gris); }
.ligne-p .o.ok { color: var(--noir); font-weight: 600; }
.ligne-p .o.ko { color: var(--gris); }
.graph { background: var(--verre-plat); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 20px; padding: 16px 14px 10px; }
.graph svg { display: block; width: 100%; height: auto; }
.graph .ax { font: 500 11px var(--f); fill: var(--gris); }

/* ---------- Plan ---------- */
.vision { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
.objs { margin: 0; display: grid; gap: 10px; }
.objs div { background: var(--verre-plat); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 16px; padding: 14px 16px; }
.objs dt { font-weight: 700; }
.objs dd { margin: 4px 0 0; color: var(--gris); font-size: 15px; }
.semaines { display: grid; gap: 8px; }
.sem { background: var(--verre-plat); border: 1px solid var(--bord); box-shadow: var(--ombre-l); border-radius: 18px; padding: 0 16px; }
.sem.now { background: var(--verre); box-shadow: inset 0 0 0 2px var(--noir), var(--ombre); }
.sem summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; padding: 14px 0; }
.sem summary::-webkit-details-marker { display: none; }
.sem .sn { width: 34px; height: 34px; border-radius: 50%; background: rgba(255, 255, 255, 0.7); box-shadow: 0 0 0 0.5px rgba(10, 10, 10, 0.12); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.sem.now .sn { background: var(--noir-verre); color: var(--blanc); box-shadow: var(--ombre-noire); }
.sem .st b { display: block; font-size: 16px; }
.sem .st small { color: var(--gris); font-size: 13.5px; }
.sem[open] { padding-bottom: 16px; }
.sem[open] > *:not(summary) { margin-top: 10px; }

.entre { animation: entre 0.3s var(--ressort) both; }
@keyframes entre { from { transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .onde::after { content: none; }
}
</style>
</head>
