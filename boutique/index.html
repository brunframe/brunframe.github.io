<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Breslev Gang — Entrez dans la boutique</title>
  <meta name="description" content="Entrez dans la boutique Breslev Gang : six vitrines, six colliers, une flamme à porter.">
  <meta name="robots" content="noindex">
  <base target="_top">
  <meta name="theme-color" content="#1b1510">
  <link rel="icon" href="assets/logo-flamme.svg" type="image/svg+xml">
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/anton-latin-400-normal.woff2" crossorigin>
  <link rel="preload" as="image" href="assets/film/allume/16x9/arrets/arret-0.webp" type="image/webp" media="(min-aspect-ratio: 91/100)">
  <link rel="preload" as="image" href="assets/film/allume/9x16/arrets/arret-0.webp" type="image/webp" media="(max-aspect-ratio: 9/10)">
  <link rel="stylesheet" href="css/boutique.css">
  <script>
    document.documentElement.classList.add('js');
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('rm');
  </script>
</head>
<body>
  <a class="evitement" href="/catalogue.html" data-lien="collection">Passer l'animation</a>

  <main id="stage" class="stage" aria-label="La boutique Breslev Gang">
    <div class="cadre" id="cadre">
      <!-- La salle recréée : une image fixe à chaque arrêt, une vidéo de marche (4K, 60 images/s) entre deux arrêts.
           Le dernier plan de chaque vidéo est identique à l'image de l'arrêt suivant : le relais est invisible.
           La visite finit face au grand logo Breslev Gang, au fond de la salle. -->
      <div class="respire">
        <img class="arret arret--a" alt="" decoding="async" fetchpriority="high">
        <img class="arret arret--b" alt="" decoding="async">
        <div class="marches"></div>
        <canvas class="survol" aria-hidden="true"></canvas>
      </div>
      <div class="reflet" aria-hidden="true"></div>
      <div class="balayage" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <canvas class="eclats" aria-hidden="true"></canvas>
    </div>

    <header class="entete">
      <a class="marque" href="/index.html" data-lien="accueil" aria-label="Breslev Gang, accueil">
        <img src="assets/logo-breslev-gang-officiel.svg" alt="" width="152" height="34">
      </a>
      <a class="passer" href="/catalogue.html" data-lien="collection" aria-label="Passer l'animation">Passer<span class="passer-suite">&nbsp;l'animation</span></a>
    </header>

    <section class="ouverture" aria-live="off">
      <h1 class="titre-ouverture">Entrez</h1>
      <p class="sous-titre">Six vitrines. Une flamme à porter.</p>
      <p class="invite" aria-hidden="true"><span>Défilez pour entrer</span><i></i></p>
    </section>

    <p class="arrivee" aria-hidden="true"><span>Six vitrines.</span> <span>Choisissez la vôtre.</span></p>

    <aside class="fiche" id="fiche" aria-live="polite" aria-label="La pièce présentée">
      <p class="fiche-num"><span data-f="num">01</span> / <span data-f="total">07</span></p>
      <h2 class="fiche-nom" data-f="nom"></h2>
      <p class="fiche-ref" data-f="refl">Réf. <span data-f="ref"></span></p>
      <p class="fiche-prix" data-f="prix"></p>
      <details class="fiche-details" data-f="details" hidden>
        <summary class="fiche-resume" data-f="resume"></summary>
        <ul class="fiche-liste" data-f="liste"></ul>
      </details>
      <p class="fiche-astuce" data-f="astuce" hidden></p>
      <a class="bouton" data-f="lien" href="#">Découvrir la pièce</a>
      <div class="fiche-nav">
        <button type="button" class="pas" data-nav="prev"><span class="pas__mot">Pièce </span>précédente</button>
        <button type="button" class="pas" data-nav="next"><span class="pas__mot">Pièce </span>suivante</button>
      </div>
    </aside>

    <section class="fin" id="fin" aria-label="Toute la collection">
      <h2 class="fin-titre">Votre pièce vous attend</h2>
      <a class="bouton" data-lien="collection" href="/catalogue.html">Choisir ma pièce</a>
    </section>

    <!-- Gros plan d'un bracelet de la table (clic sur ordinateur, doigt sur téléphone) -->
    <div class="gros" id="gros" role="dialog" aria-modal="true" aria-label="Le bracelet de près" hidden>
      <img class="gros__img" alt="" decoding="async">
      <div class="gros__texte">
        <p class="gros__nom" data-g="nom"></p>
        <p class="gros__prix" data-g="prix"></p>
        <a class="bouton" data-g="lien" href="#">Découvrir la pièce</a>
      </div>
      <div class="gros__nav">
        <button type="button" class="rond" data-gnav="prev" aria-label="Bracelet précédent">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
        <button type="button" class="rond" data-gnav="next" aria-label="Bracelet suivant">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <button type="button" class="gros__fermer" data-g="fermer">Fermer</button>
    </div>

    <!-- Page ouverte seule : le film de la marque, puis la boutique -->
    <div class="intro" id="intro" hidden>
      <video class="intro__video" muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
      <span class="intro__logo" role="img" aria-label="Breslev Gang"></span>
      <button type="button" class="intro__entrer">Entrer</button>
    </div>

    <nav class="points" aria-label="Progression dans la boutique"></nav>
    <div class="chargement" aria-hidden="true"></div>
  </main>

  <!-- Version statique : mouvement réduit, ou JavaScript absent -->
  <section class="diaporama" id="diaporama" aria-label="Les six pièces">
    <h1>La boutique</h1>
    <ol class="diaporama-liste"></ol>
    <p class="diaporama-fin"><a class="bouton" data-lien="collection" href="/catalogue.html">Choisir ma pièce</a></p>
  </section>
  <noscript><style>.diaporama{display:block!important}.stage{display:none!important}</style></noscript>

  <script src="js/donnees.js"></script>
  <script src="js/boutique.js"></script>
</body>
</html>
